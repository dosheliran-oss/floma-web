<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1115">
  <meta name="description" content="Floma, your AI assistant: chat in the browser, with Toby as an optional companion.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Floma">
  <meta name="floma-build" content="1.73.0-f750140d5ab4-7c348a45">
  <title>Floma</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=71c418f008">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5eefe63104">
  <link rel="stylesheet" href="styles.css?v=66fed5abd0">
</head>
<body>
  <!-- Step 75: כניסה / פתיחת משתמש חדש (account.js), whenever no session is active. -->
  <section class="login-screen" id="loginScreen" hidden>
    <form class="login-card" id="loginForm">
      <h1 id="loginTitle"></h1>
      <p class="hint" id="loginHint"></p>
      <div class="login-tabs">
        <button type="button" id="loginTabLogin" aria-pressed="true"></button>
        <button type="button" id="loginTabRegister" aria-pressed="false"></button>
      </div>
      <div id="loginFirebase" hidden>
        <p class="hint" id="loginFirebaseHint"></p>
        <input id="loginUrl" type="url" dir="ltr" autocomplete="off" placeholder="https://<name>.firebaseio.com">
        <input id="loginSecret" type="password" dir="ltr" autocomplete="off" placeholder="Firebase secret">
      </div>
      <input id="loginUsername" type="text" dir="auto" autocomplete="username" autocapitalize="off" spellcheck="false">
      <input id="loginDisplay" type="text" dir="auto" autocomplete="nickname" hidden>
      <input id="loginPassword" type="password" dir="auto" autocomplete="current-password">
      <p class="error" id="loginError" role="alert"></p>
      <button type="submit" id="loginSubmit"></button>
      <button type="button" class="link-button" id="loginLocal"></button>
    </form>
  </section>
  <div class="app">
    <header class="topbar">
      <button class="icon-button" id="openSessions" type="button" aria-controls="sessions" aria-expanded="false" data-i18n-label="chats"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg></button>
      <div class="avatar-wrap" id="avatarWrap">
        <img class="avatar" id="avatar" alt="" src="../app/src/main/res/drawable-nodpi/floma_logo.png" data-motion="none">
      </div>
      <div class="title">
        <h1 id="assistantName">Floma</h1>
        <span class="subtitle"><span class="brand">Floma</span> · <span id="subtitle"></span></span>
        <!-- Step 73: the system load meter (green / orange / red); a click opens Settings (breakdown, reset). -->
        <button class="load-badge" id="loadBadge" type="button" data-level="unknown"></button>
      </div>
      <!-- The quick "פלומה | טובי" switch: the same switch as the one in Settings (filled by app.js). -->
      <div class="persona-toggle" id="personaToggle" role="radiogroup" data-i18n-label="personaSwitch"></div>
      <!-- Step 70: "סיכום שיחה" - this whole chat's facts into the memory now (and Firebase). -->
      <button class="chip-button" id="summarizeChat" type="button"><span aria-hidden="true">📝</span> <span id="summarizeLabel"></span></button>
      <!-- Step 60: the Skills panel (skills.js, persona/skills_registry.js). -->
      <button class="icon-button" id="openSkills" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5Z"/></svg></button>
      <button class="icon-button" id="newChat" type="button" data-i18n-label="newChat"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25ZM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg></button>
      <button class="icon-button" id="openSettings" type="button" aria-controls="settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        <span class="visually-hidden" data-i18n="settings"></span>
      </button>
    </header>

    <p class="offline-banner" id="offlineBanner" role="status" hidden></p>
    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="composer">
      <!-- Step 60: the "@" list (filled only while an "@word" is at the caret) and the open chat's skill pill. -->
      <div class="mention-pop" id="mentionPop" role="listbox" hidden></div>
      <div class="skill-row" id="skillRow" hidden>
        <span class="skill-pill"><span id="skillPillName"></span><button type="button" id="skillPillClose">×</button></span>
      </div>
      <p class="voice-status" id="voiceStatus" role="status" hidden></p>
      <div class="attachment" id="attachment" hidden>
        <img id="attachmentImage" alt="">
        <div class="doc-chip" id="attachmentDoc" hidden></div>
        <button type="button" id="removeImage" class="remove-image" data-i18n-label="removeImage">✕</button>
      </div>
      <input type="file" id="imageInput" accept="image/*,.pdf,.txt,.md,.csv,.json,.log,application/pdf,text/plain" hidden>
      <button class="attach" id="attach" type="button" data-i18n-label="attach"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5Z"/></svg></button>
      <textarea id="input" rows="1" dir="auto" data-i18n-placeholder="placeholder" autocomplete="off"></textarea>
      <button class="live" id="live" type="button" aria-pressed="false" data-i18n-label="liveStart" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 18h2V6H7v12Zm4 4h2V2h-2v20Zm-8-8h2v-4H3v4Zm12 4h2V6h-2v12Zm4-8v4h2v-4h-2Z"/></svg></button>
      <button class="mic" id="mic" type="button" aria-pressed="false" data-i18n-label="micStart" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
      <button class="send" id="send" type="submit" data-i18n="send"></button>
    </form>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <!-- Chats: one session per conversation, newest first. -->
  <aside class="sessions" id="sessions" aria-labelledby="sessionsTitle" hidden>
    <div class="drawer-head">
      <h2 id="sessionsTitle" data-i18n="chats"></h2>
      <button class="icon-button" id="closeSessions" type="button" data-i18n-label="close">✕</button>
    </div>
    <button type="button" class="guide-button" id="sessionsGuide" data-i18n="guide"></button>
    <button type="button" class="guide-button" id="sessionsSkills"></button>
    <button type="button" class="new-chat" id="sessionsNewChat" data-i18n="newChat"></button>
    <p class="mem-badge" id="memBadgeSessions" role="status"></p>
    <p class="hint" id="ephemeralHint" hidden></p>
    <ul class="session-list" id="sessionList"></ul>
  </aside>
  <aside class="drawer" id="settings" aria-labelledby="settingsTitle" hidden>
    <div class="drawer-head">
      <h2 id="settingsTitle"><span class="brand">Floma</span> <span data-i18n="settings"></span></h2>
      <button class="icon-button help-button" id="settingsHelp" type="button" data-i18n-label="help" data-i18n-title="help">?</button>
      <button class="icon-button" id="closeSettings" type="button" data-i18n-label="close">✕</button>
    </div>

    <!-- Step 73: מד עומס מערכת - the meter, its breakdown, the fail-safe's state and its reset. -->
    <section class="load-meter">
      <h3 id="loadTitle"></h3>
      <p class="load-badge" id="loadBadgeSettings" data-level="unknown"></p>
      <progress id="loadBar" max="100" value="0" data-level="unknown"></progress>
      <p class="hint" id="loadDetail"></p>
      <p class="hint" id="loadState"></p>
      <div class="buttons"><button type="button" id="loadReset" disabled></button></div>
      <p class="hint" id="loadHint"></p>
    </section>

    <!-- Step 75: who is signed in, and התנתקות. -->
    <section class="account-section">
      <h3 id="accountTitle"></h3>
      <p class="hint" id="accountWho"></p>
      <div class="buttons"><button type="button" id="logout" class="danger"></button></div>
    </section>

    <!-- Step 76: the bot's site connections (kept on the PC): a status view, and asking the PC to open a sign-in window. -->
    <section class="bot-section">
      <h3 id="botTitle"></h3>
      <p class="hint" id="botHint"></p>
      <ul class="bot-sites" id="botSites"></ul>
      <label><input id="botTarget" type="url" dir="ltr" autocomplete="off"></label>
      <div class="buttons"><button type="button" id="botOpen"></button></div>
      <p class="hint" id="botStatus" role="status"></p>
    </section>

    <section>
      <h3 data-i18n="sectionAssistant"></h3>
      <p class="hint" data-i18n="assistantHint"></p>
      <label class="toby-addon">
        <img id="tobyAddonArt" alt="" src="../app/src/main/res/drawable-nodpi/toby_happy.png">
        <span><strong data-i18n="tobyAddon"></strong><small id="tobyAddonDesc"></small></span>
        <input id="setToby" type="checkbox" role="switch">
      </label>
    </section>

    <section>
      <h3 data-i18n="sectionToby"></h3>
      <label><span data-i18n="name"></span><input id="setName" type="text" maxlength="40" dir="auto"></label>
      <p class="hint" id="personaNote" data-i18n="personaNote" hidden></p>
      <label><span data-i18n="personality"></span>
        <select id="setPersonality">
          <option value="FRIENDLY" data-i18n="pFriendly"></option>
          <option value="PLAYFUL" data-i18n="pPlayful"></option>
          <option value="PROFESSIONAL" data-i18n="pProfessional"></option>
          <option value="CONCISE" data-i18n="pConcise"></option>
        </select>
      </label>
      <label><span data-i18n="humor"></span><input id="setHumor" type="range" min="0" max="1" step="0.05"></label>
      <label><span data-i18n="language"></span>
        <select id="setLanguage"><option value="HEBREW">עברית</option><option value="ENGLISH">English</option></select>
      </label>
      <label class="row"><input id="setSerious" type="checkbox"><span data-i18n="serious"></span></label>
      <!-- Step 73: סגנון קול ואישיות של טובי (floma_platform.js "voice_presets"; synced through Firebase). -->
      <label><span id="voicePresetTitle"></span><select id="setVoicePreset"></select></label>
      <p class="hint" id="voicePresetDesc"></p>
      <p class="hint" id="voicePresetHint"></p>
      <label><span data-i18n="instructions"></span><textarea id="setInstructions" rows="3" dir="auto"></textarea></label>
    </section>

    <section>
      <h3 data-i18n="sectionAppearance"></h3>
      <div class="theme-picker" id="themePicker" role="radiogroup" data-i18n-label="sectionAppearance"></div>
    </section>

    <section>
      <h3 data-i18n="sectionVoice"></h3>
      <label class="row"><input id="setSpeak" type="checkbox"><span data-i18n="speakReplies"></span></label>
      <p class="hint" id="speakHint"></p>
      <label><span><span data-i18n="voiceRate"></span> <output id="rateValue"></output></span><input id="setRate" type="range" min="0.5" max="2" step="0.1"></label>
      <label><span><span data-i18n="voicePitch"></span> <output id="pitchValue"></output></span><input id="setPitch" type="range" min="0.5" max="2" step="0.1"></label>
      <div class="buttons"><button type="button" id="testVoice" data-i18n="testVoice"></button></div>
      <p class="hint" data-i18n="liveHint"></p>
      <h4 data-i18n="elevenTitle"></h4>
      <p class="hint" data-i18n="elevenHint"></p>
      <p class="hint" id="elevenStatus"></p>
      <div class="quota-card" id="elevenQuota" hidden></div>
      <label><span data-i18n="elevenKey"></span><input id="elevenKey" type="password" autocomplete="off" spellcheck="false" dir="ltr"></label>
      <label><span data-i18n="elevenVoice"></span><input id="elevenVoice" type="text" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-placeholder="elevenVoicePlaceholder"></label>
      <p class="error" id="elevenProblem" role="alert"></p>
      <div class="buttons">
        <button type="button" id="elevenSave" data-i18n="elevenSave"></button>
        <button type="button" id="elevenRemove" class="danger" data-i18n="elevenRemove"></button>
      </div>
    </section>

    <section>
      <h3 data-i18n="sectionModel"></h3>
      <label><span data-i18n="modelChoice"></span><select id="setModel"></select></label>
      <p class="hint" id="modelHint"></p>
      <p class="hint" data-i18n="fallbackHint"></p>
      <p class="hint" id="keyStatus"></p>
      <div class="quota-card" id="geminiQuota" hidden></div>
      <div class="buttons">
        <button type="button" id="changeKey" data-i18n="changeKey"></button>
        <button type="button" id="removeKey" class="danger" data-i18n="removeKey"></button>
      </div>
    </section>

    <section>
      <h3 data-i18n="sectionFirebase"></h3>
      <p class="hint" data-i18n="firebaseHint"></p>
      <p class="mem-badge" id="memBadge" role="status"></p>
      <p class="hint" id="firebaseStatus"></p>
      <div class="quota-card" id="firebaseQuota" hidden></div>
      <div class="buttons">
        <button type="button" id="memSync" data-i18n="memSyncNow"></button>
        <button type="button" id="memView" data-i18n="memView"></button>
      </div>
      <label><span data-i18n="firebaseUrl"></span><input id="firebaseUrl" type="url" dir="ltr" spellcheck="false" placeholder="https://….firebaseio.com"></label>
      <label><span data-i18n="firebaseSecret"></span><input id="firebaseSecret" type="password" autocomplete="off" spellcheck="false" dir="ltr"></label>
      <p class="error" id="firebaseProblem" role="alert"></p>
      <div class="buttons">
        <button type="button" id="firebaseSave" data-i18n="firebaseSave"></button>
        <button type="button" id="firebaseRemove" class="danger" data-i18n="firebaseRemove"></button>
      </div>
    </section>

    <section>
      <h3 data-i18n="sectionSites"></h3>
      <p class="hint" data-i18n="sitesHint"></p>
      <p class="hint" data-i18n="sitesNeedsDesktop"></p>
      <ul class="site-list" id="siteList"></ul>
      <label><span data-i18n="sitesUrl"></span><input id="siteUrl" type="url" dir="ltr" spellcheck="false" placeholder="https://…"></label>
      <label><span data-i18n="sitesName"></span><input id="siteName" type="text"></label>
      <p class="error" id="siteProblem" role="alert"></p>
      <div class="buttons"><button type="button" id="siteAdd" data-i18n="sitesAdd"></button></div>
    </section>

    <section id="agentSection">
      <h3 data-i18n="sectionAgent"></h3>
      <p class="hint" data-i18n="agentHint"></p>
      <p class="hint" id="agentStatus" role="status"><span class="agent-dot" id="agentDot"></span><span id="agentStatusText"></span></p>
      <label><span data-i18n="relayUrl"></span><input id="relayUrl" type="url" dir="ltr" spellcheck="false" placeholder="https://floma-relay.….workers.dev"></label>
      <label><span data-i18n="relayKey"></span><input id="relayKey" type="password" autocomplete="off" spellcheck="false" dir="ltr"></label>
      <p class="error" id="relayProblem" role="alert"></p>
      <div class="buttons">
        <button type="button" id="relaySave" data-i18n="relaySave"></button>
        <button type="button" id="relayTest" data-i18n="relayTest"></button>
        <button type="button" id="relayRemove" class="danger" data-i18n="relayRemove"></button>
      </div>
    </section>

    <section>
      <h3 data-i18n="sectionApp"></h3>
      <p class="hint" id="installStatus"></p>
      <button type="button" id="installApp" data-i18n="installApp" hidden></button>
      <p class="hint" id="versionInfo" dir="auto"></p>
      <button type="button" id="checkUpdates" data-i18n="checkUpdates"></button>
    </section>

    <section>
      <h3 data-i18n="sectionMemory"></h3>
      <p class="hint" data-i18n="memoryHint"></p>
      <button type="button" id="clearChat" class="danger" data-i18n="clearChat"></button>
    </section>

    <section>
      <h3 data-i18n="sectionExtensions"></h3>
      <label class="row"><input id="setWebSearch" type="checkbox"><span data-i18n="extSearch"></span></label>
      <label class="row"><input id="setAutoSkills" type="checkbox"><span id="autoSkillsLabel"></span></label>
      <p class="hint" id="autoSkillsHint"></p>
      <p class="ext off"><span data-i18n="extPc"></span><small data-i18n="needsApps"></small></p>
      <p class="ext off"><span data-i18n="extPhone"></span><small data-i18n="needsAndroid"></small></p>
    </section>

  </aside>

  <!-- Step 70: "סיכום זיכרון" - every fact by topic, editable (✎ / 🗑 / add); changes are saved at once (memory.js). -->
  <dialog class="key-dialog memory-dialog" id="memoryDialog" aria-labelledby="memoryDialogTitle">
    <form method="dialog">
      <h2 id="memoryDialogTitle"></h2>
      <p class="hint" id="memoryDialogHint"></p>
      <p class="hint" id="memoryDialogStatus"></p>
      <!-- Step 74: ריכוז מידע - counts, last sync, the queue; search; backups. -->
      <p class="memory-dashboard" id="memoryDashboard"></p>
      <div class="memory-tools">
        <input id="memorySearch" type="search" dir="auto" autocomplete="off">
        <button type="button" id="memoryExport"></button>
        <button type="button" id="memoryImport"></button>
        <input id="memoryImportFile" type="file" accept="application/json,.json" hidden>
      </div>
      <div id="memoryFacts" class="memory-facts"></div>
      <div class="memory-add">
        <select id="memoryAddTopic"></select>
        <input id="memoryAddText" type="text" dir="auto" autocomplete="off">
        <button type="button" id="memoryAdd"></button>
      </div>
      <div class="buttons"><button type="submit" data-i18n="close"></button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="key-dialog skills-dialog" id="skillsDialog" aria-labelledby="skillsTitle">
    <form method="dialog">
      <h2 id="skillsTitle"></h2>
      <p class="hint" id="skillsHint"></p>
      <div id="skillsList" class="skills-list"></div>
      <div class="buttons"><button type="submit" data-i18n="close"></button></div>
    </form>
  </dialog>
  <dialog class="key-dialog guide-dialog" id="guideDialog" aria-labelledby="guideTitle">
    <form method="dialog" class="guide-frame">
      <header class="guide-head">
        <h2 id="guideTitle" class="guide-title" data-i18n="help"></h2>
        <button type="submit" id="guideClose" class="guide-close"><span aria-hidden="true">✕</span> <span data-i18n="close"></span></button>
      </header>
      <div id="guideBody" class="guide-body" dir="auto"></div>
    </form>
  </dialog>

  <dialog class="key-dialog" id="keyDialog">
    <form method="dialog" id="keyForm">
      <h2 data-i18n="keyTitle"></h2>
      <p data-i18n="keyBody"></p>
      <p class="hint" data-i18n="keyStorage"></p>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" data-i18n="keyGet"></a>
      <input id="keyInput" type="password" autocomplete="off" spellcheck="false" dir="ltr" placeholder="AIza…">
      <p class="error" id="keyError" role="alert"></p>
      <div class="buttons">
        <button type="submit" id="keySave" value="save" data-i18n="keySave"></button>
        <button type="button" id="keyLater" data-i18n="keyLater"></button>
      </div>
    </form>
  </dialog>

  <!-- The Floma platform and its assistant personas, shared with Android and the desktop app. -->
  <script src="../persona/floma_platform.js?v=025492b290"></script>
  <script src="../persona/personas.js?v=76720a2a25"></script>
  <script src="../persona/system_guide.js?v=eb31289e99"></script>
  <script src="core.js?v=ce8c102758"></script>
  <script src="account.js?v=48513a5c52"></script>
  <script src="memory.js?v=a5fe00759b"></script>
  <script src="sites.js?v=27de92a66b"></script>
  <script src="../persona/sites_catalog.js?v=7f9b2bfb52"></script>
  <script src="catalog.js?v=e43e86c6c7"></script>
  <script src="launcher.js?v=fb38d086fa"></script>
  <script src="agent.js?v=10c2d7e79e"></script>
  <script src="quota.js?v=207f9c9e4a"></script>
  <script src="voice.js?v=2f6dab09b6"></script>
  <script src="resource_guard.js?v=7aae5d2cb5"></script>
  <script src="documents.js?v=49f1dd2c9f"></script>
  <script src="../persona/skills_registry.js?v=e0ecf0f810"></script>
  <script src="../persona/knowledge_vault.js?v=a2dd6cc98c"></script>
  <script src="../persona/code_vault.js?v=17064a4ee1"></script>
